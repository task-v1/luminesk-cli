manifest_version = 1

[package]
name = "lumi-bedrock-fixture"
version = "1.0.0"
display_name = "Synthetic Lumi Bedrock Fixture"
kind = "core"
game = "minecraft"
edition = "bedrock"
summary = "Test-only Lumi Maven reference recipe"
keywords = ["synthetic", "bedrock", "lumi"]
platforms = ["linux/amd64", "linux/arm64"]

[[sources]]
id = "core"
type = "maven"
target = "server.jar"

[sources.options]
repository = "https://repo.lumi.su/releases"
group = "com.koshakmine"
artifact = "Lumi"
version = "latest"

[runtime]
image = "eclipse-temurin:21-jre"
command = ["java", "-jar", "server.jar"]

[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"

[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.jar"
