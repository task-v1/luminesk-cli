name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  UV_FROZEN: "1"

jobs:
  ci:
    name: Reuse required CI gates
    uses: ./.github/workflows/ci.yml

  version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Match tag, package metadata, and runtime constant
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

  python-artifacts:
    name: Build wheel and source distribution
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build canonical Python artifacts
        run: uv build

      - name: Verify wheel contents
        run: uv run python scripts/verify_wheel.py dist/*.whl

      - name: Attest Python artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  bundles:
    name: Bundle (${{ matrix.name }})
    needs: [ci, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: macos-amd64
            runner: macos-15-intel
          - name: windows-amd64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked bundle environment
        run: uv sync --locked --extra build

      - name: Build transparent onedir bundle
        shell: bash
        run: >-
          uv run pyinstaller
          --onedir
          --name nesk-${{ matrix.name }}
          --collect-all luminesk_cli
          --exclude-module tkinter
          luminesk_cli/__main__.py

      - name: Smoke test bundle
        shell: bash
        run: |
          EXECUTABLE="dist/nesk-${{ matrix.name }}/nesk-${{ matrix.name }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXECUTABLE="${EXECUTABLE}.exe"; fi
          "$EXECUTABLE" --version
          "$EXECUTABLE" --help
          "$EXECUTABLE" search --json

      - name: Archive bundle
        run: >-
          uv run python scripts/archive_bundle.py
          "dist/nesk-${{ matrix.name }}"
          "artifacts/nesk-${{ matrix.name }}.zip"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    needs: [python-artifacts, bundles]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/luminesk-cli/
    permissions:
      id-token: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-python
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub release
    needs: [python-artifacts, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every release artifact
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
