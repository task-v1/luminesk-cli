name: Docker E2E

on:
  workflow_call:
  push:
    branches: [main, "2.0"]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle:
    name: Install, start, readiness, and stop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime
        run: uv sync --locked

      - name: Verify Docker daemon
        run: docker version

      - name: Run real Docker lifecycle smoke test
        run: uv run python scripts/docker_e2e.py
