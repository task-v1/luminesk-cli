name: CI

on:
  push:
    branches: [main, "2.0"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_LOCKED: "1"

jobs:
  quality:
    name: Quality and typing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify project formatting policy
        run: uv run python scripts/format.py

      - name: Lint
        run: uv run ruff check .

      - name: Verify Ruff formatting
        run: uv run ruff format --check .

      - name: Type check production and tests
        run: uv run mypy .

  tests:
    name: Tests (${{ matrix.name }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-py313
            runner: ubuntu-latest
            python: "3.13"
          - name: linux-amd64-py314
            runner: ubuntu-latest
            python: "3.14"
          - name: linux-arm64-py313
            runner: ubuntu-24.04-arm
            python: "3.13"
          - name: macos-arm64-py313
            runner: macos-latest
            python: "3.13"
          - name: macos-amd64-py313
            runner: macos-15-intel
            python: "3.13"
          - name: windows-amd64-py313
            runner: windows-latest
            python: "3.13"
          - name: windows-arm64-py313
            runner: windows-11-arm
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run Luminesk 2.0 suite
        run: >-
          uv run pytest
          --strict-config
          --strict-markers
          -W error::ResourceWarning
          --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Measure branch coverage
        run: >-
          uv run pytest
          --cov=luminesk_cli
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Wheel and installed CLI
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build canonical artifacts
        run: uv build

      - name: Verify wheel contents and metadata
        run: uv run python scripts/verify_wheel.py dist/*.whl

      - name: Install wheel into a clean environment
        run: |
          uv venv .wheel-venv --python 3.13
          uv pip install --python .wheel-venv/bin/python dist/*.whl

      - name: Smoke test installed command surface
        run: |
          .wheel-venv/bin/nesk --version
          .wheel-venv/bin/nesk --help
          .wheel-venv/bin/nesk catalog status --json

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  cold-path:
    name: Cold import budget
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime
        run: uv sync --locked

      - name: Enforce version/help import and timing budgets
        run: uv run python scripts/check_cold_path.py

  required:
    name: CI required gate
    if: always()
    needs: [quality, tests, coverage, package, cold-path]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs['cold-path'].result }}" = "success"
