name: Deploy documentation

on:
  push:
    branches: [main]
    tags: ["v2.*"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install locked docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Audit docs dependencies
        run: pnpm --dir docs audit:security

      - name: Reject unsafe image formats
        run: pnpm --dir docs check:images

      - name: Type check docs application
        run: pnpm --dir docs typecheck

      - name: Build documentation
        run: pnpm --dir docs build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
