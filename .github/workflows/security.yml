name: Security

on:
  workflow_call:
  push:
    branches: [main, "2.0"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python

      - name: Analyze Python
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  security-contract:
    name: Supply-chain contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run security regression corpus
        run: >-
          uv run pytest
          tests/test_archive_security.py
          tests/test_fetch_v2.py
          tests/test_manifest.py
          tests/test_package_v2.py
          tests/test_input_security_v2.py
          tests/test_recipe_acquisition_v2.py
          tests/test_security_network.py
          tests/test_security_contracts_v2.py
          tests/test_sources_v2.py

      - name: Enforce forbidden-code policy
        run: uv run python scripts/security_gate.py

      - name: Run Bandit SAST
        run: uvx --from bandit==1.9.4 bandit -q -r luminesk_cli -ll

  dependency-audit:
    name: Runtime dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements-txt
          --output-file runtime-requirements.txt

      - name: Audit Python runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement runtime-requirements.txt
          --disable-pip
          --progress-spinner off

      - name: Generate CycloneDX SBOM
        run: >-
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements
          runtime-requirements.txt
          --pyproject pyproject.toml
          --output-reproducible
          --output-file luminesk-cli.cdx.json

      - name: Upload runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-runtime-sbom
          path: luminesk-cli.cdx.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: Security required gate
    if: always()
    needs: [codeql, dependency-review, security-contract, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job to pass
        shell: bash
        run: |
          test "${{ needs.codeql.result }}" = "success"
          test "${{ needs['security-contract'].result }}" = "success"
          test "${{ needs['dependency-audit'].result }}" = "success"
          test "${{ needs['dependency-review'].result }}" = "success" || \
            test "${{ needs['dependency-review'].result }}" = "skipped"
