version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "deps(docs)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      docs-deps:
        patterns:
          - "*"
