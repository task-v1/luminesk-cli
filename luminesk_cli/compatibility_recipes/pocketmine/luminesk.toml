manifest_version = 1
[package]
name = "pocketmine-mp"
version = "1.0.0"
platforms = ["linux/amd64", "linux/arm64"]
[[sources]]
id = "core"
provider = "github-release"
repository = "pmmp/PocketMine-MP"
version = "latest"
asset = "PocketMine-MP.phar"
target = "server.phar"
[runtime]
driver = "docker"
image = "ghcr.io/pmmp/pocketmine-mp:latest"
command = ["php", "server.phar"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.phar"
