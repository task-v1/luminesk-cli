manifest_version = 1
[package]
name = "nukkit-mot"
version = "1.0.0"
platforms = ["linux/amd64", "linux/arm64"]
[[sources]]
id = "core"
provider = "jenkins"
url = "https://motci.cn"
job = "Nukkit-MOT/job/master"
asset = "*.jar"
target = "server.jar"
[runtime]
driver = "docker"
image = "eclipse-temurin:21-jre"
command = ["java", "-jar", "server.jar"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.jar"
