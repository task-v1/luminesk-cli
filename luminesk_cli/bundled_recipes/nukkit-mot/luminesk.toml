# Bundled Luminesk 2.0 recipe.
manifest_version = 1
[package]
name = "nukkit-mot"
version = "1.0.0"
kind = "core"
game = "minecraft"
edition = "bedrock"
platforms = ["linux/amd64", "linux/arm64"]
[[sources]]
id = "core"
type = "jenkins"
target = "server.jar"
[sources.options]
base_url = "https://motci.cn"
job = "Nukkit-MOT/job/master"
artifact = "*.jar"
[runtime]
image = "eclipse-temurin:21-jre"
command = ["java", "-jar", "server.jar"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.jar"
