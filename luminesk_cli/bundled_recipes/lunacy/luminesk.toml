# Bundled Nesk 2.0 recipe.
manifest_version = 1
[package]
name = "lunacy"
version = "1.0.0"
kind = "core"
game = "minecraft"
edition = "bedrock"
platforms = ["linux/amd64", "linux/arm64"]
[[sources]]
id = "core"
type = "github-release"
target = "server.phar"
[sources.options]
repository = "karepanov35/Lunacy"
version = "latest"
asset = "PocketMine-MP.phar"
[runtime]
image = "ghcr.io/pmmp/pocketmine-mp:latest"
command = ["php", "server.phar"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
[[checks]]
id = "core-present"
phase = "post-build"
kind = "file"
path = "server.phar"
