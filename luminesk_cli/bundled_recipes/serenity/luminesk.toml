# Bundled Luminesk 2.0 recipe.
manifest_version = 1
[package]
name = "serenity"
version = "1.0.0"
kind = "core"
game = "minecraft"
edition = "bedrock"
platforms = ["linux/amd64"]
[[sources]]
id = "core"
type = "github-release"
target = "serenity"
extract = true
[sources.options]
repository = "SerenityJS/serenity"
version = "latest"
asset = "*ubuntu*.tar.gz"
[runtime]
image = "debian:bookworm-slim"
command = ["./serenity/serenity"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
