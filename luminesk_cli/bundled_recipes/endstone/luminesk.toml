# Bundled Nesk 2.0 recipe.
manifest_version = 1
[package]
name = "endstone"
version = "1.0.0"
kind = "core"
game = "minecraft"
edition = "bedrock"
platforms = ["linux/amd64", "linux/arm64"]
[[sources]]
id = "source"
type = "local-file"
target = ".build/endstone"
[sources.options]
path = "build.marker"
[build]
file = "Dockerfile"
output = "/nesk-out"
timeout = 1200
cpu = 2
network = true
[runtime]
image = "python:3.13-slim"
command = [".venv/bin/endstone", "-y"]
[[runtime.mounts]]
source = "."
target = "/server"
mode = "rw"
[[runtime.ports]]
name = "bedrock"
host = 19132
container = 19132
protocol = "udp"
